name: nirbhoy_app
description: "NIRVHOY - Women Emergency Guard App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^10.1.0
  flutter_sms: ^3.0.1
  shared_preferences: ^2.2.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#FF5252"
  image: assets/images/splash_icon.png
  color_dark: "#FF5252"
  image_dark: assets/images/splash_icon.png
  android_12:
    image: assets/images/splash_icon.png
    color: "#FF5252"
    color_dark: "#FF5252"